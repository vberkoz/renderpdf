<!DOCTYPE html>
<html>
<head>
    <title>Token Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Token Debug</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        const idToken = localStorage.getItem('id_token');
        
        if (!idToken) {
            output.innerHTML = '<p class="error">No id_token found in localStorage</p>';
        } else {
            try {
                const payload = JSON.parse(atob(idToken.split('.')[1]));
                
                const checks = [
                    { name: 'Token Use', value: payload.token_use, expected: 'id', pass: payload.token_use === 'id' },
                    { name: 'Issuer', value: payload.iss, expected: 'https://cognito-idp.us-east-1.amazonaws.com/us-east-1_kW5g1rpG7', pass: payload.iss === 'https://cognito-idp.us-east-1.amazonaws.com/us-east-1_kW5g1rpG7' },
                    { name: 'Audience', value: payload.aud, expected: '756oip5460mrcai5kptbune4b5', pass: payload.aud === '756oip5460mrcai5kptbune4b5' },
                    { name: 'Expiry', value: new Date(payload.exp * 1000).toLocaleString(), expected: 'Future', pass: payload.exp * 1000 > Date.now() }
                ];
                
                let html = '<h2>Token Validation</h2>';
                checks.forEach(check => {
                    html += `<p class="${check.pass ? 'success' : 'error'}">
                        ${check.pass ? '✓' : '✗'} ${check.name}: ${check.value}
                        ${!check.pass ? ` (Expected: ${check.expected})` : ''}
                    </p>`;
                });
                
                html += '<h2>Full Payload</h2><pre>' + JSON.stringify(payload, null, 2) + '</pre>';
                html += '<h2>Test API Call</h2><button onclick="testAPI()">Test GET /api-keys</button><div id="apiResult"></div>';
                
                output.innerHTML = html;
            } catch (e) {
                output.innerHTML = '<p class="error">Failed to decode token: ' + e.message + '</p>';
            }
        }
        
        async function testAPI() {
            const idToken = localStorage.getItem('id_token');
            const resultDiv = document.getElementById('apiResult');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch('https://api.renderpdf.vberkoz.com/api-keys', {
                    headers: {
                        'Authorization': `Bearer ${idToken}`
                    }
                });
                
                const text = await response.text();
                resultDiv.innerHTML = `
                    <p class="${response.ok ? 'success' : 'error'}">
                        Status: ${response.status} ${response.statusText}
                    </p>
                    <pre>${text}</pre>
                `;
            } catch (e) {
                resultDiv.innerHTML = `<p class="error">Error: ${e.message}</p>`;
            }
        }
    </script>
</body>
</html>
