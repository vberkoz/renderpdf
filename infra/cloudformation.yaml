AWSTemplateFormatVersion: '2010-09-09'
Description: 'HTML to PDF Service - Lambda, API Gateway, S3, DynamoDB'

Parameters:
  AppName:
    Type: String
    Default: renderpdf
    Description: Application name
  LandingDomain:
    Type: String
    Default: renderpdf.vberkoz.com
    Description: Domain name for the landing page
  HostedZoneId:
    Type: String
    Default: Z0938756375Q47T4PTZG2
    Description: Route53 Hosted Zone ID
  GoogleClientId:
    Type: String
    NoEcho: true
    Description: Google OAuth Client ID
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth Client Secret
  StatsAllowedEmail:
    Type: String
    Default: vberkoz@gmail.com
    Description: Cognito email address permitted to view private statistics
  PaddleApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Paddle API key used to create checkout transactions and portal sessions
  PaddleApiBase:
    Type: String
    Default: https://api.paddle.com
    Description: Paddle API base URL; use https://sandbox-api.paddle.com for Sandbox
  PaddleClientToken:
    Type: String
    NoEcho: true
    Default: ''
    Description: Paddle client-side token used by the RenderPDF dashboard checkout overlay
  PaddleEnvironment:
    Type: String
    Default: production
    AllowedValues:
      - sandbox
      - production
    Description: Paddle environment used by the dashboard checkout overlay
  PaddleStarterPriceId:
    Type: String
    Default: ''
    Description: Paddle recurring Starter price ID
  PaddleProPriceId:
    Type: String
    Default: ''
    Description: Paddle recurring Pro price ID
  PaddleBusinessPriceId:
    Type: String
    Default: ''
    Description: Paddle recurring Business price ID
  PaddleCheckoutUrl:
    Type: String
    Default: 'https://renderpdf.vberkoz.com/app/'
    Description: Approved RenderPDF URL used for Paddle checkout payment links
  PaddleWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Notification destination secret configured for Paddle billing webhooks
  FreeMonthlyQuota:
    Type: Number
    Default: 25
    Description: Monthly successful-PDF allowance shown to free accounts
  StarterMonthlyQuota:
    Type: Number
    Default: 5000
    Description: Monthly successful-PDF allowance for Starter accounts
  ProMonthlyQuota:
    Type: Number
    Default: 20000
    Description: Monthly successful-PDF allowance for Pro accounts
  BusinessMonthlyQuota:
    Type: Number
    Default: 100000
    Description: Monthly successful-PDF allowance for Business accounts

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-website-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${WebsiteBucket.Arn}/*'

  LandingCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref LandingDomain
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref LandingDomain
          HostedZoneId: !Ref HostedZoneId

  ViewerIpFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AppName}-viewer-ip'
      AutoPublish: true
      FunctionConfig:
        Comment: Add the trusted viewer IP used by anonymous trial quotas
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          event.request.headers['x-renderpdf-viewer-ip'] = { value: event.viewer.ip };
          return event.request;
        }

  DashboardRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AppName}-dashboard-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: Canonicalize extensionless dashboard routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function querySuffix(querystring) {
          var parts = [];
          for (var key in querystring) {
            if (!Object.prototype.hasOwnProperty.call(querystring, key)) continue;
            var entry = querystring[key];
            var values = entry.multiValue || [{ value: entry.value }];
            for (var i = 0; i < values.length; i++) {
              parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(values[i].value));
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.indexOf('/app/') !== 0) return request;

          if (uri === '/app/stats/index.html') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: '/app/stats' + querySuffix(request.querystring) },
                'cache-control': { value: 'no-store' }
              }
            };
          }

          if (uri.slice(-5) === '.html') {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: uri.slice(0, -5) + querySuffix(request.querystring) },
                'cache-control': { value: 'no-store' }
              }
            };
          }

          var routes = {
            '/app/login': true,
            '/app/callback': true,
            '/app/debug': true,
            '/app/create-render': '/app/index.html',
            '/app/create-render/': '/app/index.html',
            '/app/stats': '/app/stats/index.html'
          };
          if (routes[uri]) request.uri = routes[uri] === true ? uri + '.html' : routes[uri];
          return request;
        }

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref LandingDomain
        ViewerCertificate:
          AcmCertificateArn: !Ref LandingCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !Sub '${WebsiteBucket}.s3-website-${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
          - Id: ApiOrigin
            DomainName: !Sub '${RestApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
            OriginPath: /prod
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DashboardRoutingFunction.FunctionARN
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        CacheBehaviors:
          - PathPattern: api/v1*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerIpFunction.FunctionARN
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
                - Origin
                - X-RenderPDF-Viewer-IP
                - CloudFront-Viewer-Country
                - Access-Control-Request-Headers
                - Access-Control-Request-Method
              Cookies:
                Forward: none
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0

  LandingDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref LandingDomain
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt CloudFrontDistribution.DomainName

  PdfBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-pdfs-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireRenderedPDFs
            Status: Enabled
            Prefix: files/
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireAbandonedBatchArtifacts
            Status: Enabled
            Prefix: batches/
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PackageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-packages-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadedPackages
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [PUT]
            AllowedOrigins: ['*']
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UsageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-usage'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: AnalyticsDateIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  ApiKeysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-apikeys'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  TemplatesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AppName}-templates'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  DocumentStoreTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # The first persistence rollout retained the original named table during
      # rollback. Use a new table so this stack can be deployed without
      # deleting or taking ownership of that retained artifact.
      TableName: !Sub '${AppName}-documents-v2'
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  UserPoolV2:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AppName}-users-v2'
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolDomainV2:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${AppName}-auth-${AWS::AccountId}'
      UserPoolId: !Ref UserPoolV2

  GoogleIdentityProviderV2:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPoolV2
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: email openid profile
      AttributeMapping:
        email: email
        username: sub

  UserPoolClientV2:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdentityProviderV2
    Properties:
      ClientName: !Sub '${AppName}-client'
      UserPoolId: !Ref UserPoolV2
      AllowedOAuthFlows:
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - !Sub 'https://${LandingDomain}/app/callback'
        - !Sub 'https://${LandingDomain}/app/callback.html'
      LogoutURLs:
        - !Sub 'https://${LandingDomain}/app/'
      SupportedIdentityProviders:
        - Google

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: S3DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:DeleteObject'
                Resource: !Sub '${PdfBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:DeleteObject'
                Resource: !Sub '${PackageBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 'dynamodb:GetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:UpdateItem'
                Resource:
                  - !GetAtt UsageTable.Arn
                  - !Sub '${UsageTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - 'dynamodb:Query'
                  - 'dynamodb:GetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:UpdateItem'
                Resource:
                  - !GetAtt ApiKeysTable.Arn
                  - !Sub '${ApiKeysTable.Arn}/index/*'
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:Query', 'dynamodb:DeleteItem', 'dynamodb:UpdateItem']
                Resource: !GetAtt DocumentStoreTable.Arn
              - Effect: Allow
                Action: ['dynamodb:GetRecords', 'dynamodb:GetShardIterator', 'dynamodb:DescribeStream']
                Resource: !GetAtt DocumentStoreTable.StreamArn
              - Effect: Allow
                Action: 'dynamodb:ListStreams'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'dynamodb:DeleteItem'
                  - 'dynamodb:GetItem'
                  - 'dynamodb:PutItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:TransactWriteItems'
                  - 'dynamodb:UpdateItem'
                Resource: !GetAtt TemplatesTable.Arn
              - Effect: Allow
                Action: 'sqs:SendMessage'
                Resource: !GetAtt WebhookQueue.Arn
              - Effect: Allow
                Action: ['sqs:SendMessage', 'sqs:ReceiveMessage', 'sqs:DeleteMessage', 'sqs:GetQueueAttributes']
                Resource:
                  - !GetAtt BatchQueue.Arn
                  - !GetAtt BatchDeadLetterQueue.Arn

  WebhookDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-webhook-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-webhooks'
      VisibilityTimeout: 120
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookDeadLetterQueue.Arn
        maxReceiveCount: 4

  BatchQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-batches'
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BatchDeadLetterQueue.Arn
        maxReceiveCount: 4
      SqsManagedSseEnabled: true

  BatchDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AppName}-batch-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  PdfFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-generate'
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}:latest'
      MemorySize: 3008
      Timeout: 60
      Environment:
        Variables:
          BUCKET_NAME: !Ref PdfBucket
          TABLE_NAME: !Ref UsageTable
          FREE_MONTHLY_QUOTA: !Ref FreeMonthlyQuota
          STARTER_MONTHLY_QUOTA: !Ref StarterMonthlyQuota
          PRO_MONTHLY_QUOTA: !Ref ProMonthlyQuota
          BUSINESS_MONTHLY_QUOTA: !Ref BusinessMonthlyQuota
          WEBHOOK_QUEUE_URL: !Ref WebhookQueue
          PACKAGE_BUCKET_NAME: !Ref PackageBucket
          TEMPLATE_TABLE_NAME: !Ref TemplatesTable
          DOCUMENT_STORE_TABLE_NAME: !Ref DocumentStoreTable
          BATCH_QUEUE_URL: !Ref BatchQueue

  TrialPdfFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-trial-generate'
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}:latest'
      MemorySize: 3008
      Timeout: 60
      Environment:
        Variables:
          BUCKET_NAME: !Ref PdfBucket
          TABLE_NAME: !Ref UsageTable
          DOCUMENT_STORE_TABLE_NAME: !Ref DocumentStoreTable
          TRIAL_MODE_ONLY: 'true'
          TRIAL_DAILY_LIMIT: '3'
          TRIAL_MAX_HTML_BYTES: '1048576'

  BatchWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-batch-worker'
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}:latest'
      MemorySize: 3008
      Timeout: 60
      Environment:
        Variables:
          BATCH_WORKER: 'true'
          BUCKET_NAME: !Ref PdfBucket
          PACKAGE_BUCKET_NAME: !Ref PackageBucket
          DOCUMENT_STORE_TABLE_NAME: !Ref DocumentStoreTable
          WEBHOOK_QUEUE_URL: !Ref WebhookQueue

  BatchWorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt BatchQueue.Arn
      FunctionName: !Ref BatchWorkerFunction
      BatchSize: 1

  BatchOutboxDispatcherFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-batch-outbox-dispatcher'
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}:latest'
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          BATCH_OUTBOX_DISPATCHER: 'true'
          BATCH_QUEUE_URL: !Ref BatchQueue
          DOCUMENT_STORE_TABLE_NAME: !Ref DocumentStoreTable

  BatchOutboxDispatcherEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt DocumentStoreTable.StreamArn
      FunctionName: !Ref BatchOutboxDispatcherFunction
      StartingPosition: LATEST
      # Keep failures isolated: an unavailable queue retries only the affected
      # outbox record instead of holding up unrelated DocumentStore changes.
      BatchSize: 1

  BatchReconcilerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-batch-reconciler'
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}:latest'
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          BATCH_RECONCILER: 'true'
          DOCUMENT_STORE_TABLE_NAME: !Ref DocumentStoreTable
          WEBHOOK_QUEUE_URL: !Ref WebhookQueue

  BatchReconcilerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt BatchDeadLetterQueue.Arn
      FunctionName: !Ref BatchReconcilerFunction
      BatchSize: 1

  WebhookWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: WebhookQueueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                Resource: !GetAtt WebhookQueue.Arn

  WebhookWorkerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-webhook-worker'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt WebhookWorkerRole.Arn
      Code:
        ZipFile: |
          exports.handler = async () => ({ batchItemFailures: [] });
      MemorySize: 256
      Timeout: 30

  WebhookWorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt WebhookQueue.Arn
      FunctionName: !Ref WebhookWorkerFunction
      BatchSize: 10
      FunctionResponseTypes:
        - ReportBatchItemFailures

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-authorizer'
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}-authorizer:latest'
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          API_KEYS_TABLE: !Ref ApiKeysTable

  ApiKeysFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AppName}-apikeys'
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ImageUri: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${AppName}-apikeys:latest'
      MemorySize: 256
      Timeout: 10
      Environment:
        Variables:
          API_KEYS_TABLE: !Ref ApiKeysTable
          TABLE_NAME: !Ref UsageTable

  AnalyticsFunction:
    Type: AWS::Lambda::Function
    Properties:
      # Changing this function from an image package to a ZIP requires a
      # replacement. Use a new physical name so CloudFormation can create the
      # replacement before deleting the old custom-named function.
      FunctionName: !Sub '${AppName}-analytics-node'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        # The deployment script replaces this bootstrap handler with the
        # complete ZIP artifact after the stack update. Keeping a tiny inline
        # artifact makes first-time stack creation independent of S3 state.
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, body: JSON.stringify({ error: 'Analytics Lambda is initializing' }) });
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref UsageTable
          STATS_ALLOWED_EMAIL: !Ref StatsAllowedEmail
          PADDLE_API_KEY: !Ref PaddleApiKey
          PADDLE_API_BASE: !Ref PaddleApiBase
          PADDLE_CLIENT_TOKEN: !Ref PaddleClientToken
          PADDLE_ENVIRONMENT: !Ref PaddleEnvironment
          PADDLE_STARTER_PRICE_ID: !Ref PaddleStarterPriceId
          PADDLE_PRO_PRICE_ID: !Ref PaddleProPriceId
          PADDLE_BUSINESS_PRICE_ID: !Ref PaddleBusinessPriceId
          PADDLE_CHECKOUT_URL: !Ref PaddleCheckoutUrl
          PADDLE_WEBHOOK_SECRET: !Ref PaddleWebhookSecret
          FREE_MONTHLY_QUOTA: !Ref FreeMonthlyQuota
          STARTER_MONTHLY_QUOTA: !Ref StarterMonthlyQuota
          PRO_MONTHLY_QUOTA: !Ref ProMonthlyQuota
          BUSINESS_MONTHLY_QUOTA: !Ref BusinessMonthlyQuota

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AppName}-api'
      Description: HTML to PDF API

  RenderResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref ApiV1Resource
      PathPart: render

  PackageUploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
